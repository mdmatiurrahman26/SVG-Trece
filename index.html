<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>স্মুথ লোগো SVG কনভার্টার</title>
  <style>
    body { font-family: sans-serif; background: #1b263b; color: #fff; text-align: center; padding: 20px; }
    .container { max-width: 450px; margin: 0 auto; background: #0d1b2a; padding: 20px; border-radius: 12px; }
    h2 { color: #4cc9f0; }
    input[type="file"] { margin: 15px 0; }
    #preview-box { background: #fff; border: 2px dashed #4cc9f0; min-height: 250px; display: flex; align-items: center; justify-content: center; border-radius: 8px; margin-bottom: 15px; }
    img, svg { max-width: 100%; height: auto; display: block; margin: 0 auto; }
    button { background: #2ec4b6; color: #fff; border: none; padding: 12px 20px; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 16px; }
    button:hover { background: #20a39e; }
  </style>
</head>
<body>

<div class="container">
  <h2>স্মুথ লোগো SVG কনভার্টার</h2>
  <input type="file" id="imageInput" accept="image/*">
  
  <div id="preview-box">
    <span id="placeholderText" style="color: #666;">ছবি সিলেক্ট করুন</span>
    <canvas id="canvas" style="display:none;"></canvas>
    <div id="svgContainer"></div>
  </div>

  <button id="downloadBtn" style="display:none;">SVG ফাইল ডাউনলোড করুন</button>
</div>

<!-- ImageTracer.js Library -->
<script src="https://cdn.jsdelivr.net/npm/imagetracerjs@1.2.6/imagetracer.min.js"></script>
<script>
  const imageInput = document.getElementById('imageInput');
  const svgContainer = document.getElementById('svgContainer');
  const placeholderText = document.getElementById('placeholderText');
  const downloadBtn = document.getElementById('downloadBtn');
  let generatedSVG = "";

  imageInput.addEventListener('change', function(e) {
    const file = e.target.files[0];
    if (!file) return;

    const reader = new FileReader();
    reader.onload = function(event) {
      const img = new Image();
      img.onload = function() {
        placeholderText.style.display = 'none';
        
        // হাই-রেজুলেশন ক্যানভাসে স্কেল করা (খাঁজকাটা ভাব কমানোর জন্য)
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const scale = 3; // 3x Scaling for Ultra Smooth Edges
        canvas.width = img.width * scale;
        canvas.height = img.height * scale;
        
        ctx.imageSmoothingEnabled = true;
        ctx.imageSmoothingQuality = 'high';
        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);

        // অতি স্মুথ ট্রেসিং সেটিংস
        const options = {
          corsenabled: false,
          ltres: 0.1,         // লাইন সোজা ও স্মুথ রাখার মান
          qtres: 0.1,         // কার্ভ বা বাকের মান
          pathomit: 8,        // ছোটখাটো দাগ/নয়েজ মুছে ফেলবে
          blurradius: 2,      // স্মুথনেসের জন্য হাল্কা ব্লার
          blurdelta: 10,
          colorsampling: 2,   // সুনির্দিষ্ট কালার নির্বাচন
          numberofcolors: 16, // লোগোর সঠিক রঙ বজায় রাখার জন্য
          strokewidth: 0,
          scale: 1 / scale    // অরিজিনাল মাপে ফিরিয়ে আনা
        };

        // ট্রেসিং শুরু
        ImageTracer.imageToSVG(canvas.toDataURL(), function(svgstr) {
          generatedSVG = svgstr;
          svgContainer.innerHTML = svgstr;
          downloadBtn.style.display = 'inline-block';
        }, options);
      };
      img.src = event.target.result;
    };
    reader.readAsDataURL(file);
  });

  downloadBtn.addEventListener('click', function() {
    if (!generatedSVG) return;
    const blob = new Blob([generatedSVG], { type: 'image/svg+xml' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'smooth_logo.svg';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  });
</script>

</body>
</html>
