<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>লাইভ SVG লোগো মেকার</title>
  <style>
    body { font-family: Arial, sans-serif; background: #111827; color: #fff; text-align: center; padding: 20px; margin: 0; }
    .container { max-width: 500px; margin: 0 auto; background: #1f2937; padding: 20px; border-radius: 12px; }
    h2 { color: #38bdf8; margin-bottom: 15px; }
    
    .toolbar { display: flex; gap: 8px; justify-content: center; margin-bottom: 15px; flex-wrap: wrap; }
    .toolbar button, .toolbar input { padding: 8px 12px; border-radius: 6px; border: none; font-weight: bold; cursor: pointer; }
    .toolbar button { background: #374151; color: #fff; }
    .toolbar button.active { background: #0284c7; }
    
    #canvas-container { background: #ffffff; width: 100%; height: 320px; border-radius: 8px; border: 2px solid #38bdf8; touch-action: none; cursor: crosshair; }
    
    .action-btn { background: #10b981; color: #fff; border: none; padding: 12px 20px; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 16px; margin-top: 15px; width: 100%; }
    .action-btn:hover { background: #059669; }
    .clear-btn { background: #ef4444; margin-top: 10px; }
  </style>
</head>
<body>

<div class="container">
  <h2>লাইভ SVG লোগো মেকার</h2>
  
  <div class="toolbar">
    <input type="color" id="colorPicker" value="#8B5A2B">
    <input type="range" id="brushSize" min="2" max="30" value="8">
    <button id="clearBtn" class="clear-btn" style="margin:0; width:auto;">মুছে ফেলুন</button>
  </div>

  <div id="canvas-container">
    <svg id="svgBoard" width="100%" height="100%" viewBox="0 0 400 320" xmlns="http://www.w3.org/2000/svg" style="background: #ffffff;"></svg>
  </div>

  <button id="downloadBtn" class="action-btn">HD SVG লোগো ডাউনলোড করুন</button>
</div>

<script>
  const svgBoard = document.getElementById('svgBoard');
  const colorPicker = document.getElementById('colorPicker');
  const brushSize = document.getElementById('brushSize');
  const clearBtn = document.getElementById('clearBtn');
  const downloadBtn = document.getElementById('downloadBtn');

  let isDrawing = false;
  let currentPath = null;
  let pathData = '';

  function getPoint(e) {
    const rect = svgBoard.getBoundingClientRect();
    const clientX = e.touches ? e.touches[0].clientX : e.clientX;
    const clientY = e.touches ? e.touches[0].clientY : e.clientY;
    
    // SVG ক্যানভাসের স্কেল অনুযায়ী পয়েন্ট হিসাব করা
    const x = (clientX - rect.left) * (400 / rect.width);
    const y = (clientY - rect.top) * (320 / rect.height);
    return { x: x.toFixed(1), y: y.toFixed(1) };
  }

  function startDrawing(e) {
    isDrawing = true;
    const pt = getPoint(e);
    pathData = `M ${pt.x} ${pt.y}`;

    currentPath = document.createElementNS('http://www.w3.org/2000/svg', 'path');
    currentPath.setAttribute('d', pathData);
    currentPath.setAttribute('stroke', colorPicker.value);
    currentPath.setAttribute('stroke-width', brushSize.value);
    currentPath.setAttribute('fill', 'none');
    currentPath.setAttribute('stroke-linecap', 'round');
    currentPath.setAttribute('stroke-linejoin', 'round');

    svgBoard.appendChild(currentPath);
  }

  function draw(e) {
    if (!isDrawing) return;
    e.preventDefault();
    const pt = getPoint(e);
    pathData += ` L ${pt.x} ${pt.y}`;
    currentPath.setAttribute('d', pathData);
  }

  function stopDrawing() {
    isDrawing = false;
  }

  // ইভেন্ট লিসেনার (মাউস ও টাচ স্ক্রিন উভয়ের জন্য)
  svgBoard.addEventListener('mousedown', startDrawing);
  svgBoard.addEventListener('mousemove', draw);
  window.addEventListener('mouseup', stopDrawing);

  svgBoard.addEventListener('touchstart', startDrawing);
  svgBoard.addEventListener('touchmove', draw);
  window.addEventListener('touchend', stopDrawing);

  // মোছার বাটন
  clearBtn.addEventListener('click', () => {
    svgBoard.innerHTML = '';
  });

  // সরাসরি SVG ডাউনলোড
  downloadBtn.addEventListener('click', () => {
    const svgContent = new XMLSerializer().serializeToString(svgBoard);
    const blob = new Blob([svgContent], { type: 'image/svg+xml;charset=utf-8' });
    const url = URL.createObjectURL(blob);
    
    const a = document.createElement('a');
    a.href = url;
    a.download = 'my_vector_logo.svg';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  });
</script>

</body>
</html>
